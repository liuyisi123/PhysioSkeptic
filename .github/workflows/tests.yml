name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Check documentation links
        run: python scripts/check_docs.py
      - run: pip install -e .[dev]
      - run: pytest -q
